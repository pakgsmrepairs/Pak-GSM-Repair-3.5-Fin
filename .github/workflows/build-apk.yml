
name: Build Pak GSM Repair 6.2 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build pak gsm 6.2 APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Pak-GSM-Repair-6.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-GSM-Repair-6.2-APK
          path: app/build/outputs/apk/debug/Pak-GSM-Repair-6.2.apk
          if-no-files-found: error
          retention-days: 14

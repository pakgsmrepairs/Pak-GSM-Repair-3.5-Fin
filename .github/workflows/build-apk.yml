name: Build Pak GSM Repair 5.5 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Pak_GSM_Repair_5.5_Native_Bluetooth_Android_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project ZIP
        run: |
          mkdir android-project
          unzip -q Pak_GSM_Repair_5.5_Native_Bluetooth_Android_Source.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-GSM-Repair-5.5-debug-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

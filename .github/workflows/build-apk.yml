
name: Build Pak GSM Repair 8.0 Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle*'
      - '.github/workflows/build-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>", html, flags=re.I)
          checked = 0
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(f"/tmp/pgr-inline-{i}.js")
              path.write_text(script, encoding="utf-8")
              result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
              if result.returncode:
                  print(f"Inline script {i} failed syntax validation:")
                  print(result.stderr)
                  raise SystemExit(result.returncode)
              checked += 1
          if not checked:
              raise SystemExit("No inline JavaScript was found to validate.")
          print(f"Validated syntax for {checked} inline JavaScript blocks.")
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build pak gsm 8.0 APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Pak-GSM-Repair-8.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-GSM-Repair-8.0-APK
          path: app/build/outputs/apk/debug/Pak-GSM-Repair-8.0.apk
          if-no-files-found: error
          retention-days: 14

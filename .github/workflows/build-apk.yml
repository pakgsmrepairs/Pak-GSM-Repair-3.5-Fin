
name: Build Pak GSM Repair 9.1 Android APK
# 9.1 release source synchronized

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'index.html'
      - 'android-web-update/**'
      - 'github-pages-update/**'
      - 'icons/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle*'
      - '.github/workflows/build-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>", html, flags=re.I)
          checked = 0
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(f"/tmp/pgr-inline-{i}.js")
              path.write_text(script, encoding="utf-8")
              result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
              if result.returncode:
                  print(f"Inline script {i} failed syntax validation:")
                  print(result.stderr)
                  raise SystemExit(result.returncode)
              checked += 1
          if not checked:
              raise SystemExit("No inline JavaScript was found to validate.")
          print(f"Validated syntax for {checked} inline JavaScript blocks.")
          PY

      - name: Validate 9.1 release synchronization
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html_paths = [
              "index.html",
              "android-web-update/index.html",
              "github-pages-update/index.html",
              "app/src/main/assets/index.html",
          ]
          html = [Path(p).read_text(encoding="utf-8") for p in html_paths]
          if len(set(html)) != 1:
              raise SystemExit("Release HTML copies are not identical.")
          if "const APP_VERSION='9.1';" not in html[0] and 'const APP_VERSION="9.1";' not in html[0]:
              raise SystemExit("APP_VERSION must be 9.1.")
          if 'id="toggleCalcHistory"' not in html[0] or 'pgr-v81-calculator-history-and-compact-keys' not in html[0]:
              raise SystemExit("Calculator history/compact sizing changes are missing.")
          if 'aria-expanded="false">History ▾</button></div><div id="calcHistoryList">' not in html[0]:
              raise SystemExit("Calculator history heading markup is malformed.")
          if "statusBarPanel','soundPanel'" not in html[0]:
              raise SystemExit("Status Bar panel is not connected to settings navigation.")
          if 'id="pgrAddStatusItem"' not in html[0] or "shopLogoFile.addEventListener('change'" not in html[0]:
              raise SystemExit("Status Bar or shop-logo controls are missing their handlers.")
          for p in ["update.json", "android-web-update/update.json", "github-pages-update/update.json", "app/src/main/assets/update.json"]:
              if json.loads(Path(p).read_text(encoding="utf-8")).get("version") != "9.1":
                  raise SystemExit(f"{p} does not advertise version 9.1.")
          for p in ["cloud-config.js", "app/src/main/assets/cloud-config.js", "github-pages-update/cloud-config.js"]:
              config = Path(p).read_text(encoding="utf-8")
              if "window.PGR_APP_VERSION = '9.1';" not in config and 'window.PGR_APP_VERSION = "9.1";' not in config:
                  raise SystemExit(f"{p} has a stale app version.")
          for p in ["manifest.json", "android-web-update/manifest.json", "app/src/main/assets/manifest.json", "github-pages-update/manifest.json"]:
              if "Pak GSM Repair 9.1" not in Path(p).read_text(encoding="utf-8"):
                  raise SystemExit(f"{p} has stale manifest metadata.")
          for p in ["app/src/main/assets/icons/pgr-logo.svg", "android-web-update/icons/pgr-logo.svg", "github-pages-update/icons/pgr-logo.svg"]:
              if not Path(p).is_file():
                  raise SystemExit(f"{p} is missing; app logo path will fail.")
          android_manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:icon="@mipmap/ic_launcher"' not in android_manifest or not Path("app/src/main/res/mipmap-mdpi/ic_launcher.png").is_file():
              raise SystemExit("Android launcher icon resource is not configured.")
          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          if 'versionName = "9.1"' not in gradle or "versionCode = 9100" not in gradle:
              raise SystemExit("Android package version must be 9.1 / 9100.")
          for p in ["sw.js", "app/src/main/assets/sw.js", "github-pages-update/sw.js"]:
              if "pak-gsm-repair-v9.1-dashboard" not in Path(p).read_text(encoding="utf-8"):
                  raise SystemExit(f"{p} has a stale service-worker cache version.")
          java = Path("app/src/main/java/com/pakgsm/repair/MainActivity.java").read_text(encoding="utf-8")
          if "setAllowContentAccess(true)" not in java:
              raise SystemExit("Android WebView content URI access fix is missing.")
          workflow = Path(".github/workflows/build-apk.yml").read_text(encoding="utf-8")
          if "Pak-GSM-Repair-9.1-APK" not in workflow or "Pak-GSM-Repair-9.1.apk" not in workflow:
              raise SystemExit("APK artifact naming is not synchronized to 9.1.")
          print("Validated matching 9.1 HTML, update metadata, manifests, cache names, Android version and picker fix.")
          PY

      - name: Sync uploaded Pak GSM Repair icon into Android launcher resources
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("app/src/main/assets/icons/icon-512.png")
          if not source.is_file():
              raise SystemExit("Uploaded launcher icon app/src/main/assets/icons/icon-512.png is missing.")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          with Image.open(source) as original:
              original = original.convert("RGBA")
              for folder, size in sizes.items():
                  target = Path("app/src/main/res") / folder / "ic_launcher.png"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  original.resize((size, size), Image.Resampling.LANCZOS).save(target, format="PNG")
                  print(f"Synced launcher icon: {target} ({size}x{size})")
          PY

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build pak gsm 9.1 APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Pak-GSM-Repair-9.1.apk


      - name: Prepare stable release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing keystore exists but one or more signing secrets are missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pgr-release.jks"
          echo "PGR_KEYSTORE_PATH=$RUNNER_TEMP/pgr-release.jks" >> "$GITHUB_ENV"
          echo "PGR_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PGR_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PGR_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK for in-app updates
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: gradle --no-daemon assembleRelease

      - name: Name stable APK download
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Pak-GSM-Repair.apk

      - name: Publish signed APK to GitHub Releases
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.1
          name: Pak GSM Repair 9.1
          body: "Pak GSM Repair Android release 9.1. APK downloaded from the in-app updater is signed with the configured stable keystore."
          files: app/build/outputs/apk/release/Pak-GSM-Repair.apk
          make_latest: true
          overwrite_files: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-GSM-Repair-9.1-APK
          path: app/build/outputs/apk/debug/Pak-GSM-Repair-9.1.apk
          if-no-files-found: error
          retention-days: 14

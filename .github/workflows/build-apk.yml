name: Build Pak GSM Repair 5.7.2 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Pak_GSM_Repair_5.7.2_Android_Source_Fixed.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP="Pak_GSM_Repair_5.7.2_Android_Source_Fixed.zip"
          test -f "$ZIP"

          mkdir -p extracted android-project
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR="$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit | xargs -r dirname)"

          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || \
            test -f "$PROJECT_DIR/app/build.gradle"

          cp -a "$PROJECT_DIR"/. android-project/

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: Gradle wrapper (gradlew) is missing."
            exit 1
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -e
          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          mkdir -p release
          cp "$APK" "release/Pak-GSM-Repair-5.7.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-GSM-Repair-5.7.2-APK
          path: release/Pak-GSM-Repair-5.7.2.apk
          if-no-files-found: error
          retention-days: 14
